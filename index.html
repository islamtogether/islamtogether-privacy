    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.72 var(--sans);-webkit-font-smoothing:antialiased}a{color:var(--green);text-underline-offset:3px}a:hover{color:#8a6939}button,select{font:inherit}.site-header{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(26px,calc((100vw - 1200px)/2));background:rgba(245,242,233,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:13px;color:var(--ink);text-decoration:none}.brand img{width:48px;height:48px;object-fit:contain;border-radius:50%}.brand-name{font:600 18px/1.2 var(--serif);letter-spacing:.01em}.brand-caption{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}.header-tools{display:flex;align-items:center;gap:18px}.header-link{font-size:13px;text-decoration:none;color:var(--muted)}.language{border:1px solid #d7d0c1;border-radius:4px;background:var(--white);color:var(--ink);padding:9px 34px 9px 12px;font-size:13px}.layout{width:min(1200px,100%);margin:0 auto;padding:62px 28px 84px;display:grid;grid-template-columns:250px minmax(0,760px);gap:74px;align-items:start}.rail{position:sticky;top:118px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}.eyebrow:before{content:'';width:28px;height:1px;background:var(--gold)}.rail h2{font:500 25px/1.25 var(--serif);margin:19px 0 12px}.rail p{font-size:13px;color:var(--muted);margin:0 0 24px}.rail-note{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}.rail-note strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}.document{background:var(--white);border:1px solid #ebe6da;box-shadow:0 18px 55px rgba(41,53,44,.055);padding:clamp(28px,5vw,66px)}.doc-head{padding-bottom:32px;border-bottom:1px solid var(--line);margin-bottom:12px}.doc-head .eyebrow{margin-bottom:15px}h1{font:500 clamp(36px,5vw,56px)/1.08 var(--serif);letter-spacing:-.035em;margin:0 0 15px;max-width:650px}.lede{max-width:640px;color:#4d5e56;font:18px/1.65 var(--serif);margin:0 0 18px}.updated{color:var(--muted);font-size:12px;letter-spacing:.02em}.policy-section{padding:27px 0;border-bottom:1px solid var(--line)}.policy-section:last-child{border-bottom:0;padding-bottom:0}.policy-section h2{font:500 23px/1.25 var(--serif);margin:0 0 12px;display:flex;gap:13px;align-items:baseline}.policy-section h2 span{font:600 11px/1 var(--sans);color:var(--gold);letter-spacing:.1em}.policy-section p{color:#4b5b53;margin:0 0 11px;font-size:14px}.policy-section p:last-child{margin-bottom:0}.policy-section ul{margin:9px 0 0;padding-left:20px;color:#4b5b53;font-size:14px}.policy-section li{padding-left:4px;margin:8px 0}.policy-section li::marker{color:var(--gold)}.contact-box{margin-top:17px;background:var(--wash);border-left:3px solid var(--gold);padding:18px 20px}.contact-box a{font-weight:650}.site-footer{border-top:1px solid var(--line);padding:21px 28px 30px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.site-footer a{color:inherit}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

      <p data-i18n="railText">This policy explains what Islam Together uses to provide its features and how you can stay in control.</p>
      <div class="rail-note"><strong>Islam Together</strong><span>com.islamtogether.app</span></div>

  <script>
    const languages={
      ar:{name:'العربية',dir:'rtl',nav:'حذف الحساب',railLabel:'ثقتك تهمنا',railTitle:'توضيح شفاف لبياناتك.',railText:'تشرح هذه السياسة البيانات التي تستخدمها إسلام توغيذر لتقديم خدماتها وكيف يمكنك التحكم بها.',kicker:'الخصوصية والبيانات',title:'سياسة الخصوصية',lede:'نحترم خصوصيتك. توضح هذه الصفحة البيانات التي تعالجها إسلام توغيذر، وأسباب استخدامها، والخيارات المتاحة لك.',updated:'آخر تحديث: 16 أكتوبر 2026 · التطبيق: إسلام توغيذر (com.islamtogether.app)',sections:[['01','من نحن','إسلام توغيذر تطبيق للعبادة والتواصل. للاستفسارات حول هذه السياسة أو بياناتك، راسلنا على <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','البيانات التي نستخدمها','عند إنشاء حساب، نعالج عنوان بريدك الإلكتروني وبيانات المصادقة عبر Supabase Auth. وقد يتضمن ملفك اسم المستخدم والاسم الظاهر. عند استخدام الميزات الاجتماعية، نعالج تقدمك في الصلاة وقراءة القرآن، والأدعية التي تنشرها أو تدعمها، والرسائل التي ترسلها إلى أصدقائك.'],['03','الموقع وميزات الجهاز','قد تستخدم بيانات الموقع على جهازك لحساب أوقات الصلاة وتحديد اتجاه القبلة. لا نستخدم سجل موقعك للإعلانات. قد تطلب الميزات الاختيارية إذن الإشعارات أو المصادقة الحيوية؛ وتُستخدم بيانات البصمة محلياً بواسطة نظام الجهاز. تتم معالجة مشتريات التطبيق عبر Google Play، ولا نخزن بيانات بطاقتك.'],['04','كيف نستخدم البيانات','نستخدم البيانات لتشغيل وظائف التطبيق، ومزامنة الحساب والتقدم، وتقديم الميزات الاجتماعية، وإرسال التنبيهات التي تختارها، والرد على طلبات الدعم وحماية الخدمة. لا نبيع بياناتك ولا نشاركها لأغراض الإعلانات السلوكية.'],['05','التخزين والاحتفاظ','تُرسل البيانات بين التطبيق والخدمات السحابية عبر اتصالات HTTPS/TLS. تُخزن بيانات الحساب ما دام الحساب نشطاً. تُحذف رسائل الأصدقاء تلقائياً بعد 30 يوماً، أو عند حذف الحساب أو الصداقة. قد تعالج Supabase البيانات اللازمة لاستضافة المصادقة وقاعدة البيانات.'],['06','حقوقك وحذف الحساب','يمكنك حذف الحساب من التطبيق عبر الإعدادات ← الحساب ← حذف الحساب. يؤدي ذلك إلى حذف الحساب والملف والتقدم والصداقات والرسائل والمنشورات المرتبطة به. إذا تعذر عليك الدخول، استخدم <a href="https://islamtogether.github.io/islamtogether-delete-account/">صفحة طلب الحذف</a> أو راسلنا.'],['07','الأطفال والتغييرات','لا نقصد جمع بيانات شخصية من الأطفال دون الحد الأدنى للعمر المسموح به دون موافقة ولي الأمر عند اشتراطها. يمكن لولي الأمر التواصل معنا لطلب المساعدة. قد نحدّث هذه السياسة؛ وسيظهر تاريخ التحديث في أعلى الصفحة.']]},
      de:{name:'Deutsch',dir:'ltr',nav:'Konto löschen',railLabel:'Dein Vertrauen zählt',railTitle:'Klarheit über deine Daten.',railText:'Diese Erklärung zeigt, welche Daten Islam Together für seine Funktionen nutzt und wie du die Kontrolle behältst.',kicker:'Datenschutz & Daten',title:'Datenschutzerklärung',lede:'Deine Privatsphäre ist uns wichtig. Hier erklären wir, welche Daten Islam Together verarbeitet, warum wir sie nutzen und welche Möglichkeiten du hast.',updated:'Zuletzt aktualisiert: 16. Oktober 2026 · App: Islam Together (com.islamtogether.app)',sections:[['01','Wer wir sind','Islam Together ist eine App für Glaubenspraxis und Gemeinschaft. Bei Fragen zu dieser Erklärung oder deinen Daten erreichst du uns unter <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Daten, die wir nutzen','Bei der Kontoerstellung verarbeiten wir deine E-Mail-Adresse und Anmeldedaten über Supabase Auth. Dein Profil kann einen Benutzernamen und Anzeigenamen enthalten. Wenn du soziale Funktionen nutzt, verarbeiten wir Gebets- und Koranfortschritt, von dir veröffentlichte oder unterstützte Duas sowie Nachrichten, die du an Freunde sendest.'],['03','Standort und Gerätefunktionen','Standortdaten können auf deinem Gerät genutzt werden, um Gebetszeiten zu berechnen und die Qibla-Richtung zu bestimmen. Wir verwenden deinen Standortverlauf nicht für Werbung. Optionale Funktionen können Benachrichtigungs- oder biometrische Berechtigungen anfordern; biometrische Daten nutzt das Betriebssystem lokal. Käufe laufen über Google Play; wir speichern keine Kartendaten.'],['04','Wie wir Daten nutzen','Wir nutzen Daten, um App-Funktionen bereitzustellen, Konto und Fortschritt zu synchronisieren, Community-Funktionen zu ermöglichen, gewünschte Benachrichtigungen zu senden, Support zu leisten und den Dienst zu schützen. Wir verkaufen deine Daten nicht und geben sie nicht für verhaltensbasierte Werbung weiter.'],['05','Speicherung und Aufbewahrung','Die Übertragung zwischen App und Cloud-Diensten erfolgt über HTTPS/TLS. Kontodaten bleiben gespeichert, solange dein Konto aktiv ist. Nachrichten zwischen Freunden werden nach 30 Tagen oder bei Löschung des Kontos bzw. der Freundschaft automatisch entfernt. Supabase kann die für Authentifizierung und Datenbankhosting nötigen Daten verarbeiten.'],['06','Deine Rechte und Kontolöschung','Du kannst dein Konto in der App unter Einstellungen → Konto → Konto löschen entfernen. Dabei werden Konto, Profil, Fortschritt, Freundschaften, Nachrichten und zugehörige Beiträge gelöscht. Wenn du dich nicht anmelden kannst, nutze die <a href="https://islamtogether.github.io/islamtogether-delete-account/">Seite zur Löschanfrage</a> oder schreibe uns.'],['07','Kinder und Änderungen','Wir beabsichtigen nicht, ohne erforderliche Zustimmung eines Elternteils personenbezogene Daten von Kindern unter dem geltenden Mindestalter zu sammeln. Erziehungsberechtigte können uns um Hilfe bitten. Änderungen dieser Erklärung werden mit einem aktualisierten Datum oben kenntlich gemacht.']]},
      en:{name:'English',dir:'ltr',nav:'Delete account',railLabel:'Your trust matters',railTitle:'A clear account of your data.',railText:'This policy explains what Islam Together uses to provide its features and how you can stay in control.',kicker:'Privacy & data',title:'Privacy policy',lede:'Your privacy matters to us. This page explains what information Islam Together processes, why we use it, and the choices available to you.',updated:'Last updated: October 16, 2026 · App: Islam Together (com.islamtogether.app)',sections:[['01','Who we are','Islam Together is an app for worship and community. For questions about this policy or your information, contact <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Information we use','When you create an account, we process your email address and authentication details through Supabase Auth. Your profile may include a username and display name. When you use social features, we process prayer and Quran progress, duas you post or support, and messages you send to friends.'],['03','Location and device features','Location may be used on your device to calculate prayer times and determine the Qibla direction. We do not use your location history for advertising. Optional features may request notification or biometric permissions; biometric information is handled locally by your device operating system. Purchases are processed by Google Play; we do not store your card details.'],['04','How we use information','We use information to operate app features, sync your account and progress, provide community features, send notifications you choose, respond to support requests, and protect the service. We do not sell your information or share it for behavioral advertising.'],['05','Storage and retention','Data sent between the app and cloud services uses HTTPS/TLS. Account information is kept while your account is active. Friend messages are automatically deleted after 30 days, or when the account or friendship is deleted. Supabase may process information needed to host authentication and the database.'],['06','Your choices and account deletion','You can delete your account in the app under Settings → Account → Delete account. This removes the account, profile, progress, friendships, messages, and associated posts. If you cannot sign in, use the <a href="https://islamtogether.github.io/islamtogether-delete-account/">account deletion request page</a> or contact us.'],['07','Children and changes','We do not intend to collect personal information from children below the applicable minimum age without any parental consent required by law. A parent or guardian can contact us for help. We may update this policy; the date at the top shows when it was last revised.']]},
      es:{name:'Español',dir:'ltr',nav:'Eliminar cuenta',railLabel:'Tu confianza importa',railTitle:'Tus datos, explicados con claridad.',railText:'Esta política explica qué datos utiliza Islam Together para ofrecer sus funciones y cómo puedes mantener el control.',kicker:'Privacidad y datos',title:'Política de privacidad',lede:'Tu privacidad nos importa. Aquí explicamos qué información trata Islam Together, para qué la usamos y qué opciones tienes.',updated:'Última actualización: 16 de octubre de 2026 · App: Islam Together (com.islamtogether.app)',sections:[['01','Quiénes somos','Islam Together es una app de práctica espiritual y comunidad. Si tienes preguntas sobre esta política o tus datos, escríbenos a <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Datos que utilizamos','Al crear una cuenta, tratamos tu correo y los datos de autenticación mediante Supabase Auth. El perfil puede incluir nombre de usuario y nombre visible. Al usar las funciones sociales, tratamos el progreso de oración y Corán, las súplicas que publicas o apoyas y los mensajes que envías a tus amistades.'],['03','Ubicación y funciones del dispositivo','La ubicación puede utilizarse en tu dispositivo para calcular los horarios de oración y orientar la brújula hacia la Qibla. No usamos el historial de ubicación con fines publicitarios. Algunas funciones opcionales pueden solicitar permisos de notificaciones o biometría; el sistema del dispositivo gestiona localmente los datos biométricos. Google Play procesa las compras; no guardamos los datos de tu tarjeta.'],['04','Cómo usamos los datos','Usamos los datos para ofrecer las funciones de la app, sincronizar tu cuenta y progreso, habilitar funciones comunitarias, enviar avisos que hayas elegido, atender solicitudes de soporte y proteger el servicio. No vendemos tus datos ni los compartimos para publicidad basada en el comportamiento.'],['05','Almacenamiento y conservación','Las comunicaciones entre la app y los servicios en la nube utilizan HTTPS/TLS. Conservamos los datos de la cuenta mientras esté activa. Los mensajes entre amistades se eliminan automáticamente a los 30 días o al borrar la cuenta o la amistad. Supabase puede tratar los datos necesarios para alojar la autenticación y la base de datos.'],['06','Tus opciones y eliminación de cuenta','Puedes borrar la cuenta desde Ajustes → Cuenta → Eliminar cuenta. Se eliminan la cuenta, el perfil, el progreso, las amistades, los mensajes y las publicaciones asociadas. Si no puedes acceder, utiliza la <a href="https://islamtogether.github.io/islamtogether-delete-account/">página de solicitud de eliminación</a> o escríbenos.'],['07','Menores y cambios','No pretendemos recopilar datos personales de menores de la edad mínima aplicable sin el consentimiento parental que exija la ley. Un padre, madre o tutor puede contactarnos para pedir ayuda. Si actualizamos esta política, indicaremos la nueva fecha en la parte superior.']]},
      fr:{name:'Français',dir:'ltr',nav:'Supprimer le compte',railLabel:'Votre confiance compte',railTitle:'Vos données, en toute clarté.',railText:'Cette politique explique quelles données Islam Together utilise pour ses fonctions et comment vous gardez le contrôle.',kicker:'Confidentialité et données',title:'Politique de confidentialité',lede:'Votre vie privée compte. Cette page explique quelles informations Islam Together traite, pourquoi et quels choix s’offrent à vous.',updated:'Dernière mise à jour : 16 octobre 2026 · Application : Islam Together (com.islamtogether.app)',sections:[['01','Qui sommes-nous ?','Islam Together est une application de pratique spirituelle et de communauté. Pour toute question sur cette politique ou vos données, écrivez à <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Informations utilisées','Lors de la création d’un compte, nous traitons votre adresse e-mail et vos données d’authentification via Supabase Auth. Votre profil peut contenir un nom d’utilisateur et un nom affiché. Les fonctions sociales impliquent le traitement de votre progression de prière et de lecture du Coran, des duas publiées ou soutenues et des messages envoyés à vos amis.'],['03','Localisation et fonctions de l’appareil','La localisation peut être utilisée sur votre appareil pour calculer les horaires de prière et indiquer la direction de la Qibla. Nous n’utilisons pas l’historique de localisation à des fins publicitaires. Certaines fonctions facultatives peuvent demander l’autorisation des notifications ou de la biométrie ; les données biométriques sont gérées localement par le système de l’appareil. Google Play traite les achats ; nous ne conservons pas les données de votre carte.'],['04','Utilisation des informations','Nous utilisons les informations pour faire fonctionner l’application, synchroniser votre compte et votre progression, fournir les fonctions communautaires, envoyer les notifications choisies, répondre au support et protéger le service. Nous ne vendons pas vos informations et ne les partageons pas à des fins de publicité comportementale.'],['05','Stockage et conservation','Les échanges entre l’application et les services cloud utilisent HTTPS/TLS. Les données du compte sont conservées tant qu’il est actif. Les messages entre amis sont supprimés automatiquement après 30 jours ou lorsque le compte ou l’amitié est supprimé. Supabase peut traiter les données nécessaires à l’hébergement de l’authentification et de la base de données.'],['06','Vos choix et suppression du compte','Vous pouvez supprimer votre compte dans l’application : Paramètres → Compte → Supprimer le compte. Le compte, le profil, la progression, les amitiés, les messages et les publications associées sont supprimés. Si vous ne pouvez pas vous connecter, utilisez la <a href="https://islamtogether.github.io/islamtogether-delete-account/">page de demande de suppression</a> ou contactez-nous.'],['07','Enfants et modifications','Nous ne cherchons pas à recueillir des données personnelles d’enfants sous l’âge minimum applicable sans le consentement parental requis par la loi. Un parent ou tuteur peut nous contacter. Toute mise à jour de cette politique sera indiquée par une nouvelle date en haut de page.']]},
      it:{name:'Italiano',dir:'ltr',nav:'Elimina account',railLabel:'La tua fiducia conta',railTitle:'I tuoi dati, spiegati con chiarezza.',railText:'Questa informativa spiega quali dati utilizza Islam Together e come puoi mantenerne il controllo.',kicker:'Privacy e dati',title:'Informativa sulla privacy',lede:'La tua privacy è importante. Qui spieghiamo quali informazioni tratta Islam Together, perché le utilizziamo e quali scelte hai a disposizione.',updated:'Ultimo aggiornamento: 16 ottobre 2026 · App: Islam Together (com.islamtogether.app)',sections:[['01','Chi siamo','Islam Together è un’app per la pratica spirituale e la comunità. Per domande su questa informativa o sui tuoi dati, scrivi a <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Informazioni che utilizziamo','Quando crei un account, trattiamo il tuo indirizzo e-mail e i dati di autenticazione tramite Supabase Auth. Il profilo può includere un nome utente e un nome visualizzato. Le funzioni social comportano il trattamento dei progressi di preghiera e Corano, delle dua pubblicate o sostenute e dei messaggi inviati agli amici.'],['03','Posizione e funzioni del dispositivo','La posizione può essere usata sul dispositivo per calcolare gli orari di preghiera e indicare la direzione della Qibla. Non usiamo la cronologia della posizione per finalità pubblicitarie. Le funzioni facoltative possono richiedere notifiche o autorizzazioni biometriche; i dati biometrici sono gestiti localmente dal sistema del dispositivo. Gli acquisti sono elaborati da Google Play; non conserviamo i dati della carta.'],['04','Come utilizziamo i dati','Utilizziamo i dati per fornire le funzioni dell’app, sincronizzare account e progressi, offrire le funzioni della comunità, inviare le notifiche scelte, rispondere alle richieste di assistenza e proteggere il servizio. Non vendiamo i tuoi dati né li condividiamo per pubblicità comportamentale.'],['05','Archiviazione e conservazione','Le comunicazioni tra l’app e i servizi cloud utilizzano HTTPS/TLS. Conserviamo i dati dell’account finché è attivo. I messaggi tra amici vengono eliminati automaticamente dopo 30 giorni o quando si elimina l’account o l’amicizia. Supabase può trattare i dati necessari per ospitare autenticazione e database.'],['06','Scelte ed eliminazione dell’account','Puoi eliminare l’account dall’app: Impostazioni → Account → Elimina account. Verranno eliminati account, profilo, progressi, amicizie, messaggi e post associati. Se non riesci ad accedere, usa la <a href="https://islamtogether.github.io/islamtogether-delete-account/">pagina di richiesta di eliminazione</a> o contattaci.'],['07','Minori e modifiche','Non intendiamo raccogliere dati personali di minori al di sotto dell’età minima applicabile senza il consenso parentale richiesto dalla legge. Un genitore o tutore può contattarci per ricevere assistenza. Le modifiche a questa informativa saranno indicate dalla data aggiornata in alto.']]},
      nl:{name:'Nederlands',dir:'ltr',nav:'Account verwijderen',railLabel:'Je vertrouwen telt',railTitle:'Duidelijkheid over je gegevens.',railText:'In dit beleid lees je welke gegevens Islam Together gebruikt en hoe je daar controle over houdt.',kicker:'Privacy en gegevens',title:'Privacybeleid',lede:'Je privacy is belangrijk. Hier leggen we uit welke gegevens Islam Together verwerkt, waarom we ze gebruiken en welke keuzes je hebt.',updated:'Laatst bijgewerkt: 16 oktober 2026 · App: Islam Together (com.islamtogether.app)',sections:[['01','Wie we zijn','Islam Together is een app voor geloofspraktijk en gemeenschap. Vragen over dit beleid of je gegevens? Mail <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Gegevens die we gebruiken','Wanneer je een account aanmaakt, verwerken we je e-mailadres en aanmeldgegevens via Supabase Auth. Je profiel kan een gebruikersnaam en weergavenaam bevatten. Bij sociale functies verwerken we gebeds- en Koranvoortgang, dua’s die je plaatst of steunt en berichten die je naar vrienden stuurt.'],['03','Locatie en apparaatfuncties','Locatie kan op je apparaat worden gebruikt om gebedstijden te berekenen en de Qibla-richting te bepalen. We gebruiken je locatiegeschiedenis niet voor advertenties. Optionele functies kunnen toestemming vragen voor meldingen of biometrie; biometrische gegevens worden lokaal door het besturingssysteem verwerkt. Aankopen verlopen via Google Play; we bewaren je kaartgegevens niet.'],['04','Hoe we gegevens gebruiken','We gebruiken gegevens om appfuncties te laten werken, je account en voortgang te synchroniseren, communityfuncties aan te bieden, gekozen meldingen te sturen, support te bieden en de dienst te beveiligen. We verkopen je gegevens niet en delen ze niet voor gedragsgerichte advertenties.'],['05','Opslag en bewaartermijn','Gegevens tussen de app en clouddiensten worden via HTTPS/TLS verstuurd. Accountgegevens bewaren we zolang je account actief is. Berichten tussen vrienden worden na 30 dagen automatisch verwijderd, of wanneer het account of de vriendschap wordt verwijderd. Supabase kan gegevens verwerken die nodig zijn voor hosting van authenticatie en de database.'],['06','Je keuzes en account verwijderen','Je kunt je account verwijderen in de app via Instellingen → Account → Account verwijderen. Het account, profiel, de voortgang, vriendschappen, berichten en bijbehorende berichten worden verwijderd. Kun je niet inloggen? Gebruik dan de <a href="https://islamtogether.github.io/islamtogether-delete-account/">pagina voor verwijderingsverzoeken</a> of mail ons.'],['07','Kinderen en wijzigingen','We zijn niet van plan persoonsgegevens te verzamelen van kinderen onder de toepasselijke minimumleeftijd zonder wettelijk vereiste toestemming van een ouder. Een ouder of voogd kan contact met ons opnemen. Wijzigingen in dit beleid herken je aan de bijgewerkte datum bovenaan.']]},
      sq:{name:'Shqip',dir:'ltr',nav:'Fshi llogarinë',railLabel:'Besimi yt ka rëndësi',railTitle:'Të dhënat e tua, qartë.',railText:'Kjo politikë shpjegon cilat të dhëna përdor Islam Together dhe si mund t’i kontrollosh.',kicker:'Privatësia dhe të dhënat',title:'Politika e privatësisë',lede:'Privatësia jote ka rëndësi. Këtu shpjegojmë çfarë informacioni përpunon Islam Together, pse e përdorim dhe cilat zgjedhje ke.',updated:'Përditësuar më: 16 tetor 2026 · Aplikacioni: Islam Together (com.islamtogether.app)',sections:[['01','Kush jemi','Islam Together është një aplikacion për adhurim dhe komunitet. Për pyetje rreth kësaj politike ose të dhënave të tua, na shkruaj në <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Informacioni që përdorim','Kur krijon llogari, përpunojmë adresën e email-it dhe të dhënat e hyrjes përmes Supabase Auth. Profili mund të përmbajë emrin e përdoruesit dhe emrin e shfaqur. Kur përdor veçoritë sociale, përpunojmë përparimin në namaz dhe Kuran, lutjet që publikon ose mbështet dhe mesazhet që u dërgon miqve.'],['03','Vendndodhja dhe veçoritë e pajisjes','Vendndodhja mund të përdoret në pajisjen tënde për llogaritjen e orareve të namazit dhe drejtimin e Kibles. Historikun e vendndodhjes nuk e përdorim për reklama. Veçoritë opsionale mund të kërkojnë leje për njoftime ose biometrikë; të dhënat biometrike përpunohen lokalisht nga sistemi i pajisjes. Blerjet përpunohen nga Google Play; ne nuk ruajmë të dhënat e kartës.'],['04','Si i përdorim të dhënat','Të dhënat i përdorim për funksionet e aplikacionit, sinkronizimin e llogarisë dhe përparimit, veçoritë e komunitetit, njoftimet që zgjedh, mbështetjen dhe sigurinë e shërbimit. Nuk i shesim të dhënat dhe nuk i ndajmë për reklama të bazuara në sjellje.'],['05','Ruajtja dhe afati','Komunikimi mes aplikacionit dhe shërbimeve cloud përdor HTTPS/TLS. Të dhënat e llogarisë ruhen sa kohë llogaria është aktive. Mesazhet mes miqve fshihen automatikisht pas 30 ditësh ose kur fshihet llogaria apo miqësia. Supabase mund të përpunojë të dhënat e nevojshme për autentikimin dhe bazën e të dhënave.'],['06','Zgjedhjet e tua dhe fshirja e llogarisë','Llogarinë mund ta fshish te Cilësimet → Llogaria → Fshi llogarinë. Fshihen llogaria, profili, përparimi, miqësitë, mesazhet dhe postimet përkatëse. Nëse nuk mund të hysh, përdor <a href="https://islamtogether.github.io/islamtogether-delete-account/">faqen e kërkesës për fshirje</a> ose na kontakto.'],['07','Fëmijët dhe ndryshimet','Nuk synojmë të mbledhim të dhëna personale të fëmijëve nën moshën minimale të zbatueshme pa pëlqimin prindëror të kërkuar nga ligji. Prindi ose kujdestari mund të na kontaktojë. Përditësimet e kësaj politike do të shënohen me datën e re më sipër.']]},
      sr:{name:'Српски',dir:'ltr',nav:'Brisanje naloga',railLabel:'Vaše poverenje nam je važno',railTitle:'Jasno objašnjenje vaših podataka.',railText:'Ova politika objašnjava koje podatke Islam Together koristi i kako možete da zadržite kontrolu.',kicker:'Privatnost i podaci',title:'Politika privatnosti',lede:'Vaša privatnost nam je važna. Ovde objašnjavamo koje podatke Islam Together obrađuje, zašto ih koristimo i koje mogućnosti imate.',updated:'Poslednje ažuriranje: 16. oktobar 2026. · Aplikacija: Islam Together (com.islamtogether.app)',sections:[['01','Ko smo','Islam Together je aplikacija za versku praksu i zajednicu. Za pitanja o ovoj politici ili vašim podacima pišite na <a href="mailto:islamtogether.app@gmail.com">islamtogether.app@gmail.com</a>.'],['02','Podaci koje koristimo','Kada otvorite nalog, obrađujemo vašu imejl adresu i podatke za prijavu putem usluge Supabase Auth. Profil može da sadrži korisničko ime i prikazano ime. Ako koristite društvene funkcije, obrađujemo napredak u molitvama i čitanju Kurana, dove koje objavite ili podržite i poruke koje šaljete prijateljima.'],['03','Lokacija i funkcije uređaja','Lokacija se može koristiti na vašem uređaju za izračunavanje vremena molitve i određivanje pravca Kible. Istoriju lokacije ne koristimo za oglašavanje. Opcione funkcije mogu tražiti dozvole za obaveštenja ili biometriju; biometrijske podatke lokalno obrađuje operativni sistem uređaja. Kupovine obrađuje Google Play; ne čuvamo podatke vaše kartice.'],['04','Kako koristimo podatke','Podatke koristimo za rad funkcija aplikacije, sinhronizaciju naloga i napretka, društvene funkcije, obaveštenja koja izaberete, podršku i bezbednost usluge. Ne prodajemo vaše podatke niti ih delimo za bihevioralno oglašavanje.'],['05','Čuvanje i rokovi','Prenos između aplikacije i usluga u oblaku koristi HTTPS/TLS. Podatke naloga čuvamo dok je nalog aktivan. Poruke između prijatelja automatski se brišu nakon 30 dana ili kada se obriše nalog ili prijateljstvo. Supabase može obrađivati podatke potrebne za hosting autentifikacije i baze podataka.'],['06','Vaši izbori i brisanje naloga','Nalog možete obrisati u aplikaciji: Podešavanja → Nalog → Obriši nalog. Brišu se nalog, profil, napredak, prijateljstva, poruke i povezane objave. Ako ne možete da se prijavite, koristite <a href="https://islamtogether.github.io/islamtogether-delete-account/">stranicu za zahtev za brisanje</a> ili nam pišite.'],['07','Deca i izmene','Ne nameravamo da prikupljamo lične podatke dece mlađe od propisanog minimalnog uzrasta bez saglasnosti roditelja kada je ona zakonom potrebna. Roditelj ili staratelj može da nam se obrati. Izmene politike biće označene novim datumom na vrhu.']]}
    };
    const selector=document.getElementById('language');
    Object.entries(languages).forEach(([code,copy])=>{const option=document.createElement('option');option.value=code;option.textContent=copy.name;selector.append(option)});
    const byBrowser=(navigator.language||'es').slice(0,2);const initial=localStorage.getItem('it-language');selector.value=languages[initial]?initial:(languages[byBrowser]?byBrowser:'es');
    function render(code){const t=languages[code];document.documentElement.lang=code;document.documentElement.dir=t.dir;document.querySelectorAll('[data-i18n="deleteLink"]').forEach(el=>el.textContent=t.nav);document.querySelector('.rail .eyebrow').textContent=t.railLabel;document.querySelector('.rail h2').textContent=t.railTitle;document.querySelector('.rail p').textContent=t.railText;document.querySelector('#document').innerHTML=`<header class="doc-head"><div class="eyebrow">${t.kicker}</div><h1>${t.title}</h1><p class="lede">${t.lede}</p><div class="updated">${t.updated}</div></header>${t.sections.map(([n,title,body])=>`<section class="policy-section"><h2><span>${n}</span>${title}</h2><p>${body}</p></section>`).join('')}`;document.title=`${t.title} · Islam Together`;document.querySelector('.sr-only').textContent=({ar:'اختر اللغة',de:'Sprache auswählen',en:'Choose language',es:'Elige idioma',fr:'Choisir la langue',it:'Scegli la lingua',nl:'Kies taal',sq:'Zgjidh gjuhën',sr:'Izaberite jezik'})[code];selector.setAttribute('aria-label',document.querySelector('.sr-only').textContent);localStorage.setItem('it-language',code)}
    selector.addEventListener('change',()=>render(selector.value));render(selector.value);
  </script>
